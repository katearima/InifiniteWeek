services:
  mongo:
    image: docker.io/library/mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
